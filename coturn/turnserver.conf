# =============================================================
# coturn TURN server configuration
# One instance serves all WebRTC backends on this host.
# =============================================================

# --- Network ---------------------------------------------------

# Let coturn detect its own public IP automatically.
# Remove this and set: external-ip=1.2.3.4  if auto-detect fails
# (e.g. behind a NAT where the host doesn't see its own public IP).
detect-external-ip

# Listening ports
listening-port=3478          # STUN/TURN plain UDP+TCP
tls-listening-port=5349      # STUN/TURN over TLS/DTLS

# UDP relay port range — open this range in your firewall
min-port=49152
max-port=65535

# --- TLS -------------------------------------------------------
# Let's Encrypt certs (obtained via gen-letsencrypt.sh <turn-hostname> <email>).
# Replace <turn-hostname> with the actual hostname, e.g. turn.example.com.
# The path matches where certbot stores certs inside the shared ./certs volume.
cert=/etc/coturn/certs/live/<turn-hostname>/fullchain.pem
pkey=/etc/coturn/certs/live/<turn-hostname>/privkey.pem

# If using self-signed or manually installed certs, use this path format instead:
# cert=/etc/coturn/certs/<turn-hostname>/fullchain.pem
# pkey=/etc/coturn/certs/<turn-hostname>/privkey.pem

# --- Authentication --------------------------------------------
# Long-term credentials.  All WebRTC backends share this realm;
# each backend just needs to know the shared secret to generate tokens.
realm=turn.example.com

# Static auth secret — used with time-limited token generation.
# Generate a strong secret: openssl rand -hex 32
# Set via environment variable to avoid committing to git:
#   TURN_SECRET in .env, then reference here as:
# static-auth-secret=${TURN_SECRET}
#
# Or hard-code for simplicity (not recommended for production):
# static-auth-secret=replace-with-strong-secret

# Alternatively use username/password credentials (simpler but less flexible):
# user=webrtc:changeme

# --- Security --------------------------------------------------
# Refuse relaying to private/loopback addresses (prevents SSRF via TURN)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# If your backends are on private IPs you need to relay to, add allowed-peer-ip
# entries to override the denials above. Example:
# allowed-peer-ip=192.168.1.0-192.168.1.255

# --- Logging ---------------------------------------------------
log-file=stdout
verbose
