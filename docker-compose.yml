services:
  nginx:
    image: nginx:stable-alpine
    container_name: internet-frontend
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
      - "10.1.10.10:7443:7443"
      - "10.1.10.11:7443:7443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
      - ./hosts:/etc/hosts:ro
      - ./logs:/var/log/nginx-custom
    networks:
      - frontend
    depends_on: []

  certbot:
    image: certbot/certbot:latest
    container_name: internet-frontend-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook 'docker exec internet-frontend nginx -s reload' --quiet; sleep 12h & wait $${!}; done"
    profiles:
      - letsencrypt

volumes:
  certbot-webroot:

networks:
  frontend:
    driver: bridge
    # Add external: true and name: if backends share a Docker network
    # external: true
    # name: shared-network
