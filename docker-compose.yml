services:
  nginx:
    image: nginx:stable-alpine
    container_name: internet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "7443:7443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - frontend
    depends_on: []

  coturn:
    image: coturn/coturn:latest
    container_name: internet-frontend-coturn
    restart: unless-stopped
    # network_mode: host gives coturn direct access to real network interfaces
    # so it can detect its public IP and bind UDP correctly.
    # This is the most reliable mode for TURN servers.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro
    command: -c /etc/coturn/turnserver.conf

  certbot:
    image: certbot/certbot:latest
    container_name: internet-frontend-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      # Docker socket allows the deploy hook to restart coturn after renewal.
      # This gives certbot root-equivalent access to the host — acceptable on a
      # dedicated frontend server; remove if your threat model requires isolation.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook 'docker restart internet-frontend-coturn' --quiet; sleep 12h & wait $${!}; done"
    profiles:
      - letsencrypt

volumes:
  certbot-webroot:

networks:
  frontend:
    driver: bridge
    # Add external: true and name: if backends share a Docker network
    # external: true
    # name: shared-network
