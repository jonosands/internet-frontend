# ---------------------------------------------------------------
# app1.example.com  →  https://backend-server-1:443
# Replace hostname, cert paths, and upstream address as needed.
# ---------------------------------------------------------------

server {
    listen 443 ssl;
    http2  on;
    server_name app1.example.com;

    ssl_certificate     /etc/nginx/certs/app1.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app1.example.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass https://backend-server-1:443;
    }
}
