# ============================================================================
# devgateway.ignition.net.nz — DEV radio console (ignition-console) reverse proxy
# Backend: 10.72.95.112:8090 (plain HTTP — serves the SPA, /api, and the 2talk
#          messaging webhook + live WebSocket).
# Edge IP: 10.1.10.12 on ens192.
#
# Purpose: terminate TLS here with a CA-signed cert so external webhook callers
# (2talk SMS delivery/replies) validate the certificate — instead of hitting the
# dev box's self-signed cert, which they reject.
# ============================================================================

upstream devgateway_backend {
    server 10.72.95.112:8090;
    keepalive 32;
}

server {
    listen 10.1.10.12:443 ssl;
    listen 10.1.10.12:8443 ssl;
    http2 on;

    server_name devgateway.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/devgateway.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/devgateway.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    # NOTE: this also gates the 2talk webhook callback. 2talk is NZ-hosted so its
    # callouts pass; if a provider's webhook source is offshore, whitelist its
    # ASN/IP in the geo decision (nginx.conf) rather than removing this.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # The dev console backend is plain HTTP and serves every path (SPA, /api,
    # /api/messaging/webhook/*, and the live WS), so proxy everything through one
    # location. proxy-params.conf carries the WebSocket Upgrade headers.
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://devgateway_backend;
    }
}
