# ============================================================================
# Ignition appliance remote-support ENROLLMENT service (Model A) - reverse proxy
# Backend: radio_box 10.120.1.220:8089 (HTTP; FastAPI enrollment service)
# Public surface: ONLY /v1/enroll + /healthz. Admin endpoints are never exposed here.
# ============================================================================

upstream enroll_backend {
    server 10.120.1.220:8089;
    keepalive 16;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name enroll.ignition.net.nz;

    # Same wildcard *.ignition.net.nz cert as the other services (installed per-host dir).
    ssl_certificate     /etc/nginx/certs/enroll.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/enroll.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NOTE: no geo-allowlist — customer appliances enrol from anywhere, and the request is
    # auth-gated by the activation code. Uncomment to restrict to NZ/AU + Starlink:
    # include /etc/nginx/snippets/geo-allowlist.conf;

    client_max_body_size 16k;   # tiny JSON enrollment payloads only

    # Appliance enrollment endpoint: POST {activation_code, device_fingerprint}.
    location = /v1/enroll {
        proxy_pass http://enroll_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Health probe (backend FastAPI /healthz).
    location = /healthz {
        proxy_pass http://enroll_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Everything else — including /v1/admin/* — is closed at the edge. Provision activation
    # codes on the LAN/host only, never through the public edge.
    location / {
        access_log /var/log/nginx-custom/enroll-blackhole.log blackhole;
        return 444;
    }
}
