# ============================================================================
# HF Gateway (CodanHF) - reverse proxy
# Backend: 10.120.1.220:443
# ============================================================================

upstream hf_backend {
    server 10.120.1.220:443;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name hf.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/hf.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hf.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # ------------------------------------------------------------------------
    # Control WebSocket — radio state, events, notifications
    # ------------------------------------------------------------------------
    location = /ws {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # ------------------------------------------------------------------------
    # Audio WebSocket — binary Opus frames, bidirectional, long-lived
    # ------------------------------------------------------------------------
    location /ws/audio/ {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # ------------------------------------------------------------------------
    # REST API
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ------------------------------------------------------------------------
    # Health check
    # ------------------------------------------------------------------------
    location = /health {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ------------------------------------------------------------------------
    # Static frontend assets (Vite build — JS, CSS, fonts, icons)
    # ------------------------------------------------------------------------
    location /assets/ {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ------------------------------------------------------------------------
    # Main app shell and all other frontend routes
    # ------------------------------------------------------------------------
    location / {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ------------------------------------------------------------------------
    # Blackhole — scanner bait and unexpected extensions. Log and drop.
    # Swap return 444 for proxy_pass during discovery to observe before blocking.
    # ------------------------------------------------------------------------
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        access_log /var/log/nginx-custom/hf-blackhole.log blackhole;
        return 444;
    }
}
