# ============================================================================
# HF backend - reverse proxy
# Backend: 10.120.1.220:443
# ============================================================================

upstream hf_backend {
    server 10.120.1.220:443;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name hf.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/live/hf.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/hf.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass https://hf_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
