# ============================================================================
# HF Gateway (CodanHF) - reverse proxy  [hf.radio.ignition.net.nz]
# Backend: 10.120.1.220:443  (same backend as the legacy hf.ignition.net.nz)
#
# Part of the radio.ignition.net.nz pair:
#   hf.radio.ignition.net.nz   → CodanHF      (this file)
#   vhf.radio.ignition.net.nz  → radiocontrol (vhf.radio.ignition.net.nz.conf)
# Seamless SSO between the two is via the shared Entra IdP browser session
# (silent OIDC), not a shared cookie — each app has its own auth.db.
#
# The legacy hf.ignition.net.nz.conf is left untouched and keeps working.
# ============================================================================

upstream hf_radio_backend {
    server 10.120.1.220:443;
    keepalive 32;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name hf.radio.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/hf.radio.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hf.radio.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # The proxy-common/ws snippets verify the upstream TLS with
    # `proxy_ssl_name $host` (= hf.radio.ignition.net.nz). CodanHF's backend cert
    # at 10.120.1.220:443 is for hf.ignition.net.nz, not hf.radio, so we override
    # proxy_ssl_name to hf.ignition.net.nz after each include — verification then
    # passes against the existing cert (the same backend the legacy
    # hf.ignition.net.nz vhost already proxies to). The Host header stays
    # hf.radio.ignition.net.nz; CodanHF's nginx serves it via `server_name _`.
    # (Drop these overrides once the backend cert gains a hf.radio.* SAN.)
    # Cookies pass through untouched; X-Forwarded-Proto is set for Secure cookies.

    # Control WebSocket — radio state, events, notifications
    location = /ws {
        proxy_pass https://hf_radio_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
        proxy_ssl_name hf.ignition.net.nz;   # CodanHF cert is for hf.ignition.net.nz
    }

    # Audio WebSocket — binary Opus frames, bidirectional, long-lived
    location /ws/audio/ {
        proxy_pass https://hf_radio_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
        proxy_ssl_name hf.ignition.net.nz;   # CodanHF cert is for hf.ignition.net.nz
    }

    # REST API (login, users, OIDC authorize/callback all live under /api/)
    location /api/ {
        proxy_pass https://hf_radio_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_ssl_name hf.ignition.net.nz;   # CodanHF cert is for hf.ignition.net.nz
    }

    # Health check
    location = /health {
        proxy_pass https://hf_radio_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_ssl_name hf.ignition.net.nz;   # CodanHF cert is for hf.ignition.net.nz
    }

    # Static frontend assets (Vite build — JS, CSS, fonts, icons)
    location /assets/ {
        proxy_pass https://hf_radio_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_ssl_name hf.ignition.net.nz;   # CodanHF cert is for hf.ignition.net.nz
    }

    # Main app shell and all other frontend routes (incl. /auth/callback)
    location / {
        proxy_pass https://hf_radio_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_ssl_name hf.ignition.net.nz;   # CodanHF cert is for hf.ignition.net.nz
    }

    # Blackhole — scanner bait and unexpected extensions. Log and drop.
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        access_log /var/log/nginx-custom/hf-radio-blackhole.log blackhole;
        access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
        return 444;
    }
}
