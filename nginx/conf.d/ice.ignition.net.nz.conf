server {
    listen 443 ssl;
    http2  on;
    server_name ice.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/live/ice.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/ice.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass              https://10.72.95.111:443;
        proxy_http_version      1.1;
        proxy_ssl_verify        off;
        proxy_ssl_server_name   on;
        proxy_ssl_name          ice.ignition.net.nz;
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffer_size        128k;
        proxy_buffers            8 256k;
        proxy_busy_buffers_size  256k;

        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header X-Frame-Options              "SAMEORIGIN"    always;
        add_header Strict-Transport-Security    "max-age=31622400; includeSubDomains" always;
    }

    location ~* \.wasm$ {
        proxy_pass            https://10.72.95.111:443;
        proxy_buffering       off;
        proxy_ssl_verify      off;
        proxy_ssl_server_name on;
        proxy_ssl_name        ice.ignition.net.nz;
        proxy_set_header Host $host;
    }

    location ~* ^/(ws|socket|signalling|rtc) {
        proxy_pass https://10.72.95.111:8443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_ssl_verify        off;
        proxy_ssl_server_name   on;
        proxy_ssl_name          ice.ignition.net.nz;
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}

