# ============================================================================
# Instant Connect Enterprise (Rallytac engage engine) - reverse proxy
# Backend: 10.72.95.111:443 (HTTPS, self-managed cert valid for this hostname)
# ============================================================================

upstream ice_backend {
    server 10.72.95.111:443;
    keepalive 32;
}

server {
    listen 10.1.10.10:443 ssl;
    listen 10.1.10.10:8443 ssl;
    http2 on;

    server_name ice.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/ice.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ice.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # ------------------------------------------------------------------------
    # Flutter web app static assets — JS and WASM need CORP backstop
    # The worker pool spawns 16 copies of engagewasm.js; without CORP they
    # all get blocked by COEP: require-corp on the parent document.
    # ------------------------------------------------------------------------
    location ~* ^/web/.+\.(js|wasm)$ {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;

        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ------------------------------------------------------------------------
    # Everything else under /web/ — HTML shell, fonts, images, css, favicon
    # ------------------------------------------------------------------------
    location /web/ {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ------------------------------------------------------------------------
    # Auth and SSO discovery
    # ------------------------------------------------------------------------
    location = /sso-login {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /login {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /logout {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /sso-meta {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ------------------------------------------------------------------------
    # Web client command/control WebSocket
    # ------------------------------------------------------------------------
    location = /websocket {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # ------------------------------------------------------------------------
    # Rallypoint media bridge — real-time audio over WebSocket.
    # Latency-sensitive: no buffering, long read timeout for idle sessions.
    # Both web client and desktop client connect here.
    # ------------------------------------------------------------------------
    # --- Paths surfaced by live ICEDesktop client traffic (2026-06-24) ---
    # Were dropped with 444 by the catch-all because the original allowlist was
    # built from a partial path set. Confirmed real backend routes: /sso -> 302
    # (Entra SSO redirect); /files/ and /archivedrecording/ -> presigned MinIO
    # downloads (X-Amz-* query auth).
    location = /sso {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /files/ {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /archivedrecording/ {
        proxy_pass https://ice_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /rp {
        proxy_pass https://ice_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name         on;
        proxy_ssl_name                $host;
        proxy_ssl_session_reuse       on;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    24h;
        proxy_send_timeout    24h;
    }

    # ------------------------------------------------------------------------
    # Bare root — redirect to /web/ for convenience
    # ------------------------------------------------------------------------
    location = / {
        return 302 /web/;
    }

    # ------------------------------------------------------------------------
    # Blackhole — anything not matched above. Log and close.
    # During discovery phase: change `return 444` to `proxy_pass https://ice_backend;`
    # to observe-without-blocking. Once logs are quiet, switch back to 444.
    # ------------------------------------------------------------------------
    location / {
        access_log /var/log/nginx-custom/ice-blackhole.log blackhole;
        # A location-level access_log cancels the server-level audit logs, so
        # restate the offshore-Starlink audit: an allowed offshore-Starlink
        # client hitting an unmatched path still belongs in offshore-starlink.log.
        access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
        return 444;
    }
}
