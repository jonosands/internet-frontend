# ============================================================================
# Legacy ignition.net.nz radio consoles → radio.landsarcomms.org.nz  (301)
#
# hf.ignition.net.nz (HF) and vhf.ignition.net.nz (VHF/RadioControl) previously
# served their own consoles at this edge. The stack has collapsed to the single
# ignition-console at radio.landsarcomms.org.nz, but those hostnames still resolve
# to this edge (A → 101.98.11.137). Keep a thin per-host redirect vhost so an old
# bookmark / DNS entry lands the user on the new console instead of a cert error
# or a dead host.
#
# One server{} per host because each terminates TLS under its OWN hostname — the
# handshake for the legacy name must complete (its cert) BEFORE the 301 is sent;
# the *.landsarcomms.org.nz cert on the radio vhost cannot answer for these names.
# Both certs are the existing *.ignition.net.nz wildcard the removed vhosts used
# (edge-managed, gitignored, per-host dirs) — verify they are still present on the
# edge and `nginx -t` before reload (a missing cert path fails the whole config).
#
# 301 (permanent) + $request_uri preserves the path + query. Same NZ/AU+Starlink
# geo-allowlist as every other vhost (the redirect target is geo-gated too).
# ============================================================================

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name hf.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/hf.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hf.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    include /etc/nginx/snippets/geo-allowlist.conf;

    return 301 https://radio.landsarcomms.org.nz$request_uri;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name vhf.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/vhf.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vhf.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    include /etc/nginx/snippets/geo-allowlist.conf;

    return 301 https://radio.landsarcomms.org.nz$request_uri;
}
