# ============================================================================
# LANDSAR (Rallytac engage engine) - reverse proxy
# Backend: 10.120.1.211:443 (HTTPS, self-managed cert valid for this hostname)
# ============================================================================

upstream landsar_backend {
    server 10.120.1.211:443;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen 8443 ssl;
    http2 on;

    server_name landsar.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/live/landsar.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/landsar.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location ~* ^/web/.+\.(js|wasm)$ {
        proxy_pass https://landsar_backend;
        include /etc/nginx/snippets/proxy-common.conf;

        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location /web/ {
        proxy_pass https://landsar_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /login {
        proxy_pass https://landsar_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /logout {
        proxy_pass https://landsar_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /sso-meta {
        proxy_pass https://landsar_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location = /websocket {
        proxy_pass https://landsar_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    location = /rp {
        proxy_pass https://landsar_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name         on;
        proxy_ssl_name                $host;
        proxy_ssl_session_reuse       on;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    24h;
        proxy_send_timeout    24h;
    }

    location = / {
        return 302 /web/;
    }

    location / {
        access_log /var/log/nginx-custom/landsar-blackhole.log blackhole;
        return 444;
    }
}
