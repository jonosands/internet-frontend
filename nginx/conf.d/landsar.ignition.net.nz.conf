upstream landsar_backend_443 {
    server 10.120.1.211:443;
    keepalive 32;
}

upstream landsar_backend_8443 {
    server 10.120.1.211:8443;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name landsar.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/live/landsar.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/landsar.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass https://landsar_backend_443;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify                  on;
        proxy_ssl_trusted_certificate     /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name             on;
        proxy_ssl_name                    landsar.ignition.net.nz;
        proxy_ssl_session_reuse           on;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name landsar.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/live/landsar.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/landsar.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass https://landsar_backend_8443;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify                  on;
        proxy_ssl_trusted_certificate     /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name             on;
        proxy_ssl_name                    landsar.ignition.net.nz;
        proxy_ssl_session_reuse           on;

        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}
