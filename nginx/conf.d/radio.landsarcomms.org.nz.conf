# ============================================================================
# Ignition console (new stack) - reverse proxy  [radio.landsarcomms.org.nz]
#
# TWO plain-HTTP backends on radio_box (10.120.1.220), both reached over the
# trusted LAN; client TLS terminates HERE at the edge (the bundled self-signed
# `edge` on the box is retired — this is the sole SSL offload):
#   :18080  ignition-console  — SPA, REST API, control WebSocket
#   :8200   gateway-engine     — browser media (WebCodecs WS + WebRTC signalling)
#
# Media is same-origin (console returns endpoint "/v1/engine/media" — no
# IGNITION_GATEWAY_MEDIA_URL), so the browser opens wss://radio.landsarcomms.org.nz
# /v1/engine/media and this edge proxies it straight to the gateway-engine. Without
# that location the media requests fall through to the console and 405 (no audio).
#
# landsarcomms.org.nz is a separate customer-owned apex (Cloudflare DNS) with its
# own real Sectigo cert (not the *.ignition.net.nz wildcard).
# ============================================================================

upstream radio_landsarcomms_backend {
    server 10.120.1.220:18080;   # ignition-console (plain HTTP)
    keepalive 32;
}

upstream radio_landsarcomms_gateway {
    server 10.120.1.220:8200;    # gateway-engine media adapter (plain HTTP)
    keepalive 8;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name radio.landsarcomms.org.nz;

    ssl_certificate     /etc/nginx/certs/radio.landsarcomms.org.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/radio.landsarcomms.org.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # Plain-HTTP internal LAN hop to the console/gateway (both plain HTTP). Client
    # TLS terminates here; X-Forwarded-Proto=https keeps the app's session cookie
    # Secure. The browser only ever talks to the edge over HTTPS.

    # Control WebSocket — live radio/activity feed
    location = /ws {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # ------------------------------------------------------------------------
    # Browser media → gateway-engine (:8200). Covers the WebCodecs audio WS
    # (GET /v1/engine/media, long-lived binary Opus) AND the WebRTC signalling
    # (POST /v1/engine/media/offer, DELETE /v1/engine/media/session). The WS
    # snippet's Upgrade headers are harmless on the plain POST/DELETE calls.
    # ------------------------------------------------------------------------
    location /v1/engine/media {
        proxy_pass http://radio_landsarcomms_gateway;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # REST API → console
    location /api/ {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Health check → console
    location = /health {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Static frontend assets (Vite build) → console
    location /assets/ {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Everything else: console API routes + the React SPA.
    location / {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Blackhole — scanner bait and unexpected extensions. Log and drop.
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        access_log /var/log/nginx-custom/radio-landsarcomms-blackhole.log blackhole;
        access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
        return 444;
    }
}
