# ============================================================================
# Ignition console (new stack) - reverse proxy  [radio.landsarcomms.org.nz]
# Backend: 10.120.1.220:8081  (ignition-console on radio_box, plain HTTP — the
#          bundled self-signed `edge` on 8443 is left running unused; TLS
#          terminates here at the edge, same convention as vhf/hf.ignition.net.nz)
#          Port is 8081, not the container's native 8080: that host port was
#          already taken by the legacy hf-gateway-deploy watchtower sidecar
#          (IGNITION_CONSOLE_PORT=8081 in radio_box's ignition-deploy/.env).
#
# landsarcomms.org.nz is a separate customer-owned apex domain (Cloudflare DNS),
# NOT part of the ignition.net.nz zone, so this uses its own real cert
# (Sectigo, extracted from landsarcomms.org.nz.pfx) rather than the
# *.ignition.net.nz wildcard.
# ============================================================================

upstream radio_landsarcomms_backend {
    server 10.120.1.220:8081;
    keepalive 32;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name radio.landsarcomms.org.nz;

    ssl_certificate     /etc/nginx/certs/radio.landsarcomms.org.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/radio.landsarcomms.org.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # Plain-HTTP internal LAN hop to the console (:8081). Client TLS terminates
    # here; X-Forwarded-Proto=https keeps the app's session cookie Secure. The
    # browser only ever talks to the edge over HTTPS.

    # Live radio/activity feed WebSocket
    location = /ws {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # Everything else: console API routes + the React SPA.
    location / {
        proxy_pass http://radio_landsarcomms_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Blackhole — scanner bait and unexpected extensions. Log and drop.
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        access_log /var/log/nginx-custom/radio-landsarcomms-blackhole.log blackhole;
        access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
        return 444;
    }
}
