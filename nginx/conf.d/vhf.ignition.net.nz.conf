# ============================================================================
# RadioControl (VHF) - reverse proxy  [vhf.ignition.net.nz]
# Backend: 10.120.1.220:8100  (radiocontrol app on radio_box, plain HTTP — its
#          own nginx/TLS is disabled, so TLS terminates here at the edge)
#
# Single-level name so the *.ignition.net.nz wildcard cert covers it. The HF
# counterpart is the existing hf.ignition.net.nz vhost (CodanHF).
# ============================================================================

upstream vhf_backend {
    server 10.120.1.220:8100;
    keepalive 32;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name vhf.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/vhf.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vhf.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # Plain-HTTP internal LAN hop to radiocontrol (:8100). Client TLS terminates
    # here; X-Forwarded-Proto=https keeps the app's session cookie Secure. The
    # browser only ever talks to the edge over HTTPS. Cookies pass through.

    # Live radio feed WebSocket
    location = /ws {
        proxy_pass http://vhf_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # Codan live message feed WebSocket
    location /codan-live/ws {
        proxy_pass http://vhf_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # Everything else: the backend routes its own API paths (/app /api /config
    # /tait /codan /motorola /health /messages /location /docs) and falls
    # through to the React SPA — a single location covers them all.
    location / {
        proxy_pass http://vhf_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Blackhole — scanner bait and unexpected extensions. Log and drop.
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        access_log /var/log/nginx-custom/vhf-blackhole.log blackhole;
        access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
        return 444;
    }
}
