# ============================================================================
# RadioControl (VHF) - reverse proxy  [vhf.radio.ignition.net.nz]
# Backend: 10.120.1.220:8443  (radiocontrol container nginx, co-located with
#          CodanHF on radio_box; its nginx host port is 8443 since CodanHF owns
#          443 — see radiocontrol/docker-compose.yml NGINX_HTTPS_PORT=8443)
#
# Part of the radio.ignition.net.nz pair:
#   hf.radio.ignition.net.nz   → CodanHF      (hf.radio.ignition.net.nz.conf)
#   vhf.radio.ignition.net.nz  → radiocontrol (this file)
# ============================================================================

upstream vhf_radio_backend {
    server 10.120.1.220:8443;
    keepalive 32;
}

server {
    listen 10.1.10.10:443 ssl;
    http2 on;

    server_name vhf.radio.ignition.net.nz;

    ssl_certificate     /etc/nginx/certs/vhf.radio.ignition.net.nz/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vhf.radio.ignition.net.nz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # NZ/AU + Starlink allowlist — drops everything else with 444.
    include /etc/nginx/snippets/geo-allowlist.conf;

    # NOTE: proxy-common/ws snippets do `proxy_ssl_verify on; proxy_ssl_name
    # $host`, so the radiocontrol container's nginx cert (radiocontrol/certs/)
    # must be valid for vhf.radio.ignition.net.nz — install the LE cert there
    # (preferred over relaxing proxy_ssl_verify). Cookies pass through untouched;
    # X-Forwarded-Proto is set so the backend marks the session cookie Secure.

    # Live radio feed WebSocket
    location = /ws {
        proxy_pass https://vhf_radio_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # Codan live message feed WebSocket
    location /codan-live/ws {
        proxy_pass https://vhf_radio_backend;
        include /etc/nginx/snippets/proxy-ws-common.conf;
    }

    # Everything else: the backend routes its own API paths (/app /api /config
    # /tait /codan /motorola /health /messages /location /docs) and falls
    # through to the React SPA — a single location covers them all.
    location / {
        proxy_pass https://vhf_radio_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Blackhole — scanner bait and unexpected extensions. Log and drop.
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        access_log /var/log/nginx-custom/vhf-radio-blackhole.log blackhole;
        access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
        return 444;
    }
}
