user  nginx;
worker_processes  auto;
worker_rlimit_nofile 130048;
worker_shutdown_timeout 10s;
error_log  /var/log/nginx-custom/error.log warn;
pid        /var/run/nginx.pid;

# MaxMind GeoIP2 modules are compiled in via Dockerfile, but the runtime DBs
# may be absent on a fresh host. Leave the module loading disabled so nginx can
# start and serve traffic while the DBs are provisioned later.
# load_module modules/ngx_http_geoip2_module.so;
# load_module modules/ngx_stream_geoip2_module.so;

events {
    multi_accept on;
    use epoll;
    worker_connections 16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host upstream=$upstream_addr';

    access_log  /var/log/nginx-custom/access.log  main;

    log_format blackhole '$remote_addr [$time_local] '
                         '"$request" '
                         'ua="$http_user_agent" '
                         'ref="$http_referer" '
                         'origin="$http_origin"';

    # ------------------------------------------------------------------------
    # GeoIP2 allowlist filter
    #
    # The runtime MaxMind DBs are not currently present, so the GeoIP modules are
    # disabled for now. We still keep the allowlist variables defined as simple
    # defaults so the vhost snippets can include them without failing.
    # ------------------------------------------------------------------------

    # Audit log format retained for compatibility with the vhost snippets.
    log_format geo_audit '$remote_addr [$time_local] '
                         'country=$geoip2_country_iso asn=$geoip2_asn org="$geoip2_as_org" '
                         'host=$host "$request" status=$status '
                         'ua="$http_user_agent"';

    # Internal/trusted source networks bypass geo-filtering entirely so that
    # health checks, LAN clients and backends are never blocked when the geo
    # DB has no entry for a private address.
    geo $remote_addr $geo_internal {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
    }

    # Default values when the GeoIP DBs are unavailable.
    map "" $geoip2_country_iso { default "ZZ"; }
    map "" $geoip2_asn { default "0"; }
    map "" $geoip2_as_org { default ""; }

    # Allow all traffic by default until GeoIP DBs are restored.
    map "" $geo_allowed_country { default 1; }
    map "" $geo_is_starlink { default 0; }
    map "$geo_internal$geo_allowed_country$geo_is_starlink" $geo_blocked {
        default 0;
    }
    map "$geo_internal$geo_allowed_country$geo_is_starlink" $log_offshore_starlink {
        default 0;
    }

    sendfile        on;
    keepalive_timeout  65;

    # Security headers applied globally
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only set COEP on top-level navigations, not fetch/XHR sub-resource responses
    map $http_sec_fetch_mode $coep_header {
        navigate   "require-corp";
        default    "";
    }

    # WebSocket connection header upgrade map
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    # Hide nginx version
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # ------------------------------------------------------------------------
    # Stream proxy block. GeoIP lookups are disabled until real MaxMind DBs are
    # available, so this block simply allows the passthrough to work.
    # ------------------------------------------------------------------------
    geo $remote_addr $stream_internal {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
    }
    map "" $stream_country_iso { default "ZZ"; }
    map "" $stream_asn { default "0"; }
    map "" $stream_as_org { default ""; }
    map "" $stream_allowed_country { default 1; }
    map "" $stream_is_starlink { default 0; }
    map "$stream_internal$stream_allowed_country$stream_is_starlink" $stream_blocked {
        default 0;
    }
    map "$stream_internal$stream_allowed_country$stream_is_starlink" $stream_offshore_starlink {
        default 0;
    }

    log_format stream_main '$remote_addr [$time_local] '
                           'country=$stream_country_iso asn=$stream_asn org="$stream_as_org" '
                           'blocked=$stream_blocked offshore_starlink=$stream_offshore_starlink '
                           'dst=$server_addr '
                           'backend="$backend_7443" '
                           'status=$status '
                           'bytes_sent=$bytes_sent bytes_recv=$bytes_received '
                           'session_time=$session_time';

    access_log /var/log/nginx-custom/stream-7443.log stream_main;

    # Route to the backend for the listener IP, but only when geo allows it.
    # $stream_blocked is 0 (allow) or 1 (block); a blocked connection or an
    # unknown listener IP falls through to "" and is dropped.
    map "$stream_blocked:$server_addr" $backend_7443 {
        "0:10.1.10.10"  10.72.95.111:7443;
        "0:10.1.10.11"  10.120.1.211:7443;
        default         "";
    }

    server {
        listen 10.1.10.10:7443;
        listen 10.1.10.11:7443;
        proxy_pass $backend_7443;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
