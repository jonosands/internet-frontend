user  nginx;
worker_processes  auto;
worker_rlimit_nofile 130048;
worker_shutdown_timeout 10s;
error_log  /var/log/nginx-custom/error.log warn;
pid        /var/run/nginx.pid;

# MaxMind GeoIP2 modules (compiled in via Dockerfile). Must load in the main
# context, before events{}/http{}/stream{}. Used by the geo-allowlist filter.
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_stream_geoip2_module.so;

events {
    multi_accept on;
    use epoll;
    worker_connections 16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host upstream=$upstream_addr';

    access_log  /var/log/nginx-custom/access.log  main;

    log_format blackhole '$remote_addr [$time_local] '
                         '"$request" '
                         'ua="$http_user_agent" '
                         'ref="$http_referer" '
                         'origin="$http_origin"';

    # ------------------------------------------------------------------------
    # GeoIP2 allowlist filter
    #
    # Only NZ/AU + Starlink (and internal networks) may reach any vhost.
    # The geoip2{} blocks and decision maps live here at http level; each
    # server{} includes snippets/geo-allowlist.conf to enforce + log them.
    #
    # Source is $remote_addr (the real TCP peer): this box is the edge, so the
    # peer IP is unforgeable. Do NOT switch to X-Forwarded-For — clients can
    # spoof it. If a CDN/LB is ever placed in front, add the realip module with
    # that provider's CIDRs in set_real_ip_from before trusting any header.
    #
    # !! KEEP IN SYNC with the stream{} block !! The country list, the Starlink
    # ASN list, and the internal CIDR set are duplicated there (http and stream
    # are separate module contexts and cannot share an include). Change both.
    # ------------------------------------------------------------------------

    # Country of the client IP. default=ZZ keeps the var non-empty for IPs the
    # database doesn't know (private/unallocated) so map matching is predictable.
    geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
        auto_reload 60m;
        $geoip2_country_iso default=ZZ source=$remote_addr country iso_code;
    }

    # ASN + org of the client IP, for the Starlink allowance and audit logging.
    geoip2 /etc/nginx/geoip/GeoLite2-ASN.mmdb {
        auto_reload 60m;
        $geoip2_asn    source=$remote_addr autonomous_system_number;
        $geoip2_as_org source=$remote_addr autonomous_system_organization;
    }

    # Audit log for blocked + offshore-Starlink traffic. Includes the geo data
    # so false positives and offshore usage are diagnosable.
    log_format geo_audit '$remote_addr [$time_local] '
                         'country=$geoip2_country_iso asn=$geoip2_asn org="$geoip2_as_org" '
                         'host=$host "$request" status=$status '
                         'ua="$http_user_agent"';

    # Internal/trusted source networks bypass geo-filtering entirely so that
    # health checks, LAN clients and backends are never blocked when the geo
    # DB has no entry for a private address.
    geo $remote_addr $geo_internal {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
    }

    # Whitelisted countries.
    map $geoip2_country_iso $geo_allowed_country {
        default 0;
        NZ      1;
        AU      1;
    }

    # Starlink / SpaceX ASNs — allowed worldwide by default. Keyed on ASN
    # (stable) rather than org name (changes). AS14593 is the primary consumer
    # egress; the others are SpaceX-owned members of the AS14593 as-set that
    # carry a small tail of Starlink traffic.
    map $geoip2_asn $geo_is_starlink {
        default 0;
        14593   1;   # SPACEX-STARLINK (primary)
        397763  1;   # SpaceX Services, Inc.
        149662  1;   # SpaceX / Starlink (as-set member)
        53348   1;   # SpaceX / Starlink (as-set member)
    }

    # Block unless internal OR allowed-country OR Starlink. Each flag is a
    # single 0/1 char, so the concatenation is collision-free; only "000" blocks.
    map "$geo_internal$geo_allowed_country$geo_is_starlink" $geo_blocked {
        "000"   1;
        default 0;
    }

    # Offshore Starlink = not internal, not NZ/AU, but Starlink ASN => "001".
    # These are allowed (Starlink is whitelisted) but logged for visibility.
    map "$geo_internal$geo_allowed_country$geo_is_starlink" $log_offshore_starlink {
        "001"   1;
        default 0;
    }

    sendfile        on;
    keepalive_timeout  65;

    # Security headers applied globally
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only set COEP on top-level navigations, not fetch/XHR sub-resource responses
    map $http_sec_fetch_mode $coep_header {
        navigate   "require-corp";
        default    "";
    }

    # WebSocket connection header upgrade map
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    # Hide nginx version
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # ------------------------------------------------------------------------
    # Same NZ/AU + Starlink allowlist as the HTTP vhosts, applied to the raw
    # TCP passthrough on :7443. Stream has no `if`/`return 444`, so a blocked
    # connection is dropped by routing it to an empty upstream (the existing
    # "unknown listener -> default ''" idiom), which closes the connection
    # without sending anything — the stream analogue of a silent 444.
    #
    # !! KEEP IN SYNC with the http{} block !! The country list, Starlink ASN
    # list, and internal CIDR set below mirror the http{} definitions and must
    # be changed together (separate module contexts can't share an include).
    # ------------------------------------------------------------------------
    geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
        auto_reload 60m;
        $stream_country_iso default=ZZ source=$remote_addr country iso_code;
    }
    geoip2 /etc/nginx/geoip/GeoLite2-ASN.mmdb {
        auto_reload 60m;
        $stream_asn    source=$remote_addr autonomous_system_number;
        $stream_as_org source=$remote_addr autonomous_system_organization;
    }

    geo $remote_addr $stream_internal {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
    }
    map $stream_country_iso $stream_allowed_country {
        default 0;
        NZ      1;
        AU      1;
    }
    map $stream_asn $stream_is_starlink {
        default 0;
        14593   1;   # SPACEX-STARLINK (primary)
        397763  1;   # SpaceX Services, Inc.
        149662  1;   # SpaceX / Starlink (as-set member)
        53348   1;   # SpaceX / Starlink (as-set member)
    }
    map "$stream_internal$stream_allowed_country$stream_is_starlink" $stream_blocked {
        "000"   1;
        default 0;
    }
    map "$stream_internal$stream_allowed_country$stream_is_starlink" $stream_offshore_starlink {
        "001"   1;
        default 0;
    }

    log_format stream_main '$remote_addr [$time_local] '
                           'country=$stream_country_iso asn=$stream_asn org="$stream_as_org" '
                           'blocked=$stream_blocked offshore_starlink=$stream_offshore_starlink '
                           'dst=$server_addr '
                           'backend="$backend_7443" '
                           'status=$status '
                           'bytes_sent=$bytes_sent bytes_recv=$bytes_received '
                           'session_time=$session_time';

    access_log /var/log/nginx-custom/stream-7443.log stream_main;

    # Route to the backend for the listener IP, but only when geo allows it.
    # $stream_blocked is 0 (allow) or 1 (block); a blocked connection or an
    # unknown listener IP falls through to "" and is dropped.
    map "$stream_blocked:$server_addr" $backend_7443 {
        "0:10.1.10.10"  10.72.95.111:7443;
        "0:10.1.10.11"  10.120.1.211:7443;
        default         "";
    }

    server {
        listen 10.1.10.10:7443;
        listen 10.1.10.11:7443;
        proxy_pass $backend_7443;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
