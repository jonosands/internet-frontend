user  nginx;
worker_processes  auto;
worker_rlimit_nofile 130048;
worker_shutdown_timeout 10s;
error_log  /var/log/nginx-custom/error.log warn;
pid        /var/run/nginx.pid;

events {
    multi_accept on;
    use epoll;
    worker_connections 16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host upstream=$upstream_addr';

    access_log  /var/log/nginx-custom/access.log  main;

    log_format blackhole '$remote_addr [$time_local] '
                         '"$request" '
                         'ua="$http_user_agent" '
                         'ref="$http_referer" '
                         'origin="$http_origin"';

    sendfile        on;
    keepalive_timeout  65;

    # Security headers applied globally
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only set COEP on top-level navigations, not fetch/XHR sub-resource responses
    map $http_sec_fetch_mode $coep_header {
        navigate   "require-corp";
        default    "";
    }

    # WebSocket connection header upgrade map
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    # Hide nginx version
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format stream_main '$remote_addr [$time_local] '
                           'dst=$server_addr '
                           'backend="$backend_7443" '
                           'status=$status '
                           'bytes_sent=$bytes_sent bytes_recv=$bytes_received '
                           'session_time=$session_time';

    access_log /var/log/nginx-custom/stream-7443.log stream_main;

    map $server_addr $backend_7443 {
        10.1.10.10  10.72.95.111:7443;
        10.1.10.11  10.120.1.211:7443;
        default     "";
    }

    server {
        listen 10.1.10.10:7443;
        listen 10.1.10.11:7443;
        proxy_pass $backend_7443;
        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
