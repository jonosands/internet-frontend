user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Security headers applied globally
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only set COEP on top-level navigations, not fetch/XHR sub-resource responses
    map $http_sec_fetch_mode $coep_header {
        navigate   "require-corp";
        default    "";
    }

    # WebSocket connection header upgrade map
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    # Hide nginx version
    server_tokens off;

    # HTTP → HTTPS redirect catch-all
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge passthrough
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

stream {
    map $ssl_preread_server_name $backend_ip {
        ice.ignition.net.nz      10.72.95.111;
        landsar.ignition.net.nz  10.120.1.211;
        hf.ignition.net.nz       10.120.1.220;
        default                  "";
    }

    server {
        listen 7443;
        proxy_pass $backend_ip:7443;
        ssl_preread on;

        proxy_connect_timeout 10s;
        proxy_timeout 1h;
    }
}
