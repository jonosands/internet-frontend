# ============================================================================
# Geo allowlist — include inside EVERY server{} block, right after ssl-params.
#
# Whitelist model: a connection is allowed only if its source IP is
#   (a) inside NZ or AU (GeoLite2-Country), OR
#   (b) on a Starlink/SpaceX ASN (GeoLite2-ASN), OR
#   (c) an internal/trusted network (health checks, LAN, backends).
# Everything else is dropped with `return 444` — a silent connection close
# that returns no response, so the filter itself is invisible to clients.
#
# The decision variables ($geo_blocked, $log_offshore_starlink) and the geoip2
# lookups they depend on are defined once at http level in nginx.conf.
# ============================================================================

# Block in the server REWRITE phase — this runs before any location is
# selected, so one check covers every route in the vhost. `return` is the only
# directive used here, which is the documented-safe use of `if` at server level.
if ($geo_blocked) {
    return 444;
}

# A server-level access_log cancels inheritance of the http-level log for this
# server, so restate the main log here, then add the audit logs alongside it
# (multiple access_log directives at the same level all fire).
access_log /var/log/nginx-custom/access.log main;

# Record every geo-blocked request server-side. The client still just sees a
# closed connection (444); this log is for tuning and spotting false positives.
access_log /var/log/nginx-custom/geo-block.log geo_audit if=$geo_blocked;

# Starlink is allowed worldwide, but connections from outside NZ/AU are audited
# so offshore usage is visible. (Domestic NZ/AU Starlink is not logged here.)
access_log /var/log/nginx-custom/offshore-starlink.log geo_audit if=$log_offshore_starlink;
