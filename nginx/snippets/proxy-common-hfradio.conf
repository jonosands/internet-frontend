# proxy-common.conf variant for hf.radio.ignition.net.nz.
# Identical to proxy-common.conf EXCEPT proxy_ssl_name is pinned to
# hf.ignition.net.nz: the CodanHF backend (10.120.1.220:443) serves a cert for
# hf.ignition.net.nz, not hf.radio, so upstream TLS verification must use that
# name. (Drop this and use proxy-common.conf once the backend cert gains a
# hf.radio.* SAN.) Keep in sync with proxy-common.conf otherwise.
proxy_http_version 1.1;

# Connection reuse — works with the `keepalive 32` in upstream block
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Backend TLS — verify against the backend's real (hf.ignition.net.nz) cert
proxy_ssl_verify              on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_server_name         on;
proxy_ssl_name                hf.ignition.net.nz;
proxy_ssl_session_reuse       on;

# Don't buffer responses — keeps things snappy and avoids edge cases
proxy_buffering off;

proxy_connect_timeout 10s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
