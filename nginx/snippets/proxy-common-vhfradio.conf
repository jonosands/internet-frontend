# proxy-common.conf variant for vhf.radio.ignition.net.nz.
# Identical to proxy-common.conf EXCEPT upstream TLS verification is OFF: the
# radiocontrol backend (10.120.1.220:8443) is not deployed yet and the cert it
# will serve on this internal LAN hop is unknown, so traffic pushes straight
# through regardless. Switch back to proxy-common.conf once radiocontrol serves
# a real vhf.radio.ignition.net.nz cert. Keep in sync otherwise.
proxy_http_version 1.1;

# Connection reuse — works with the `keepalive 32` in upstream block
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Backend TLS — verification disabled (internal LAN backend, cert TBD); still
# send SNI so radiocontrol can route/select a cert once it presents one.
proxy_ssl_verify        off;
proxy_ssl_server_name   on;
proxy_ssl_name          $host;
proxy_ssl_session_reuse on;

# Don't buffer responses — keeps things snappy and avoids edge cases
proxy_buffering off;

proxy_connect_timeout 10s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
