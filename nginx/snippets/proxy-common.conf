# Proxy directives for non-WebSocket HTTP traffic to ICE backend
proxy_http_version 1.1;

# Connection reuse — works with the `keepalive 32` in upstream block
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Backend TLS — it has a real cert, verify properly
proxy_ssl_verify              on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_server_name         on;
proxy_ssl_name                $host;
proxy_ssl_session_reuse       on;

# Don't buffer responses — keeps things snappy and avoids edge cases
proxy_buffering off;

proxy_connect_timeout 10s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
