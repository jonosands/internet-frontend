# Standard proxy headers — included by each vhost
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_http_version  1.1;
proxy_set_header    Upgrade    $http_upgrade;
proxy_set_header    Connection "upgrade";

proxy_connect_timeout  10s;
proxy_send_timeout     60s;
proxy_read_timeout     60s;
proxy_buffering        off;

# SSL re-encryption to backend — disable verify for self-signed backend certs.
# Set proxy_ssl_verify on and supply proxy_ssl_trusted_certificate if backends
# have a trusted cert (recommended for production).
proxy_ssl_verify        off;
proxy_ssl_server_name   on;
proxy_ssl_protocols     TLSv1.2 TLSv1.3;
