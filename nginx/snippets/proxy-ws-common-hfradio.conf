# proxy-ws-common.conf variant for hf.radio.ignition.net.nz.
# Identical to proxy-ws-common.conf EXCEPT proxy_ssl_name is pinned to
# hf.ignition.net.nz (the CodanHF backend cert name). See
# proxy-common-hfradio.conf for the rationale. Keep in sync otherwise.
proxy_http_version 1.1;

# WebSocket upgrade
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Backend TLS — verify against the backend's real (hf.ignition.net.nz) cert
proxy_ssl_verify              on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_server_name         on;
proxy_ssl_name                hf.ignition.net.nz;
proxy_ssl_session_reuse       on;

# Critical for low-latency WebSocket traffic
proxy_buffering         off;
proxy_request_buffering off;

# Long-lived connections. Default 60s read_timeout would kill idle sessions.
proxy_connect_timeout 10s;
proxy_read_timeout    1h;
proxy_send_timeout    1h;
