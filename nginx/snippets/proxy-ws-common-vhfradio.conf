# proxy-ws-common.conf variant for vhf.radio.ignition.net.nz.
# Identical to proxy-ws-common.conf EXCEPT upstream TLS verification is OFF
# (radiocontrol backend not deployed; cert TBD). See proxy-common-vhfradio.conf
# for the rationale. Keep in sync otherwise.
proxy_http_version 1.1;

# WebSocket upgrade
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Backend TLS — verification disabled (internal LAN backend, cert TBD)
proxy_ssl_verify        off;
proxy_ssl_server_name   on;
proxy_ssl_name          $host;
proxy_ssl_session_reuse on;

# Critical for low-latency WebSocket traffic
proxy_buffering         off;
proxy_request_buffering off;

# Long-lived connections. Default 60s read_timeout would kill idle sessions.
proxy_connect_timeout 10s;
proxy_read_timeout    1h;
proxy_send_timeout    1h;
